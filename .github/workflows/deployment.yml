name: Build Image ECR

on:
  push:
    branches:
      - develop

env:
  REPOSITORY_TEST: portal-mx-api
  IMAGE_TAG: ${{ vars.APP_NAME }}-${{ github.sha }}

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY_TEST }}:${{ env.IMAGE_TAG }}
          build-args: |
            IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY_TEST }}:${{ env.IMAGE_TAG }}
            APP_NAME=${{ vars.APP_NAME }}
            APP_PORT=${{ vars.APP_PORT }}
            APP_ENV=${{ vars.APP_ENV }}
            APP_CORS_ORIGIN=${{ vars.APP_CORS_ORIGIN }}
            APP_CORS_ALLOWED_HEADERS=${{ vars.APP_CORS_ALLOWED_HEADERS }}
            APP_CORS_ALLOWED_METHODS=${{ vars.APP_CORS_ALLOWED_METHODS }}
            BASE_URL=${{ vars.BASE_URL }}
            DEBUG=${{ vars.DEBUG }}
            SWAGGER_USER=${{ secrets.SWAGGER_USER }}
            SWAGGER_PASSWORD=${{ secrets.SWAGGER_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_TYPE=${{ secrets.DB_TYPE }}
            DB_POOL_SIZE=${{ secrets.DB_POOL_SIZE }}
            GITHUB_TOKEN=${{ github.token }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            JWT_REFRESH_TOKEN_EXPIRES_IN=${{ secrets.JWT_REFRESH_TOKEN_EXPIRES_IN }}
            AWS_REGION=${{ vars.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_BUCKET_NAME=${{ vars.AWS_BUCKET_NAME }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_SENDER=${{ secrets.MAIL_SENDER }}
            MAIL_SECURE=${{ secrets.MAIL_SECURE }}



  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy service
        uses: appleboy/ssh-action@master
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY_TEST }}:${{ env.IMAGE_TAG }}
        with:
          envs: IMAGE
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            sh /home/services/setup.sh
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY_TEST }}:${{ env.IMAGE_TAG }}
            docker stack deploy -c /home/services/stacks/${{ vars.APP_NAME }}.yml ${{ vars.APP_NAME }} --with-registry-auth
